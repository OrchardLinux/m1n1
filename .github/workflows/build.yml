# This is a basic workflow to help you get started with Actions

name: build

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install aarch64-linux-gnu- toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-aarch64-linux-gnu

      - name: Install aarch64-unknown-none-softfloat rust target
        run: |
          rustup target install aarch64-unknown-none-softfloat

      - name: Build
        run: make -k -j2 ARCH=aarch64-linux-gnu- CHAINLOADING=1

      - uses: actions/upload-artifact@v7
        with:
          name: m1n1
          path: |
            build/m1n1.macho
            build/m1n1.bin

  # The 32-bit m1n1 for Apple's ARMv7 chips, built as orchard builds it
  # (boot/m1n1/build there), so a change that breaks it fails here first.
  build-armv7:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install LLVM 19
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-19 lld-19 llvm-19

      # orchard's toolchain (boot/m1n1/install-toolchain there): the 32-bit
      # m1n1 is position independent, so it builds core and alloc itself
      # from rust-src.
      - name: Install Rust 1.90.0 with armv7a-none-eabi and rust-src
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
          rustup target add --toolchain 1.90.0 armv7a-none-eabi
          rustup component add --toolchain 1.90.0 rust-src

      - name: Build
        run: >-
          make -j2 M1N1_ARCH=arm USE_CLANG=1 CHAINLOADING=1
          TOOLCHAIN=/usr/lib/llvm-19/bin/ LLDDIR=/usr/lib/llvm-19/bin/

      - uses: actions/upload-artifact@v7
        with:
          name: m1n1-armv7
          path: build/m1n1-armv7.macho
